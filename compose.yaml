services:
    database:
        image: postgres:18

        container_name: licit_monitor_postgres

        restart: unless-stopped

        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

        ports:
            - "127.0.0.1:${POSTGRES_PORT}:5432"

        volumes:
            - database_data:/var/lib/postgresql
            - ./back_end/init_db:/docker-entrypoint-initdb.d:ro

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    collector_licitacao:
        build:
            context: ./collector
            dockerfile: Dockerfile

        restart: "no"

        env_file:
            - .env

        command: ["python", "main_licitacao.py"]

        depends_on:
            database:
                condition: service_healthy

    collector_dispensa:
        build:
            context: ./collector
            dockerfile: Dockerfile

        restart: "no"

        env_file:
            -   .env

        command: ["python", "main_dispensa.py"]

        depends_on:
            database:
                condition: service_healthy

volumes:
    database_data:
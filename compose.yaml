services:
    database:
        image: postgres:18

        container_name: database

        restart: unless-stopped

        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

        ports:
            - "127.0.0.1:${POSTGRES_PORT}:5432"

        volumes:
            - database_data:/var/lib/postgresql
            - ./back_end/init_db:/docker-entrypoint-initdb.d:ro

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    collector_licitacao:
        build:
            context: ./collector
            dockerfile: Dockerfile

        environment:
            PYTHONDONTWRITEBYTECODE: "1"

        container_name: collectorLicit

        restart: unless-stopped

        env_file:
            - .env

        command: ["python", "main_licitacao.py"]

        depends_on:
            database:
                condition: service_healthy

    collector_dispensa:
        build:
            context: ./collector
            dockerfile: Dockerfile

        environment:
            PYTHONDONTWRITEBYTECODE: "1"

        container_name: collectorDisp

        restart: unless-stopped

        env_file:
            -   .env

        command: ["python", "main_dispensa.py"]

        depends_on:
            database:
                condition: service_healthy

    backend:
        build:
            context: ./back_end
            dockerfile: Dockerfile

        environment:
            PYTHONDONTWRITEBYTECODE: "1"

        container_name: lmt_backend_api

        restart: "no"

        env_file:
            -   .env

        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

        ports:
            -   "8000:8000"

        volumes:
            -   ./back_end:/app

        depends_on:
            database:
                condition: service_healthy

    front_end:
        build:
            context: ./front_end
            dockerfile: Dockerfile

        container_name: lmt_front_end

        restart: unless-stopped

        command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

        ports:
            -   "5173:5173"

        volumes:
            - ./front_end:/app
            - front_end_node_modules:/app/node_modules

        depends_on:
            - backend

        environment:
            VITE_API_URL: ${VITE_API_URL}

        stdin_open: true
        tty: true

volumes:
    database_data:
    front_end_node_modules: